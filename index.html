<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHƯƠNG TRÌNH TIN HỌC 12</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 18px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .sidebar ol, .sidebar ul {
            list-style-position: inside;
        }

        .sidebar li {
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .sidebar a {
            color: #ecf0f1;
            text-decoration: none;
            display: block;
            padding: 8px 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .sidebar a:hover {
            background-color: #3498db;
            padding-left: 15px;
            color: white;
        }

        .sidebar a:target {
            background-color: #3498db;
            color: white;
        }

        /* Main Content Area */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #3498db;
            color: white;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
        }

        /* Content Display */
        .content-display {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .content-frame {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .content-frame:target {
            display: block;
        }

        .welcome-message {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            color: #2c3e50;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .welcome-message h2 {
            color: #3498db;
            margin-bottom: 10px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
            }

            .sidebar {
                width: 100%;
                max-height: 200px;
            }

            .content-area {
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <h2>📚 BÀI TẬP</h2>
            <ol>
                <li><a href="#intro">GIỚI THIỆU</a></li>
                <li><a href="#tinhoc">CHƯƠNG TRÌNH TIN HỌC 12</a></li>
                <li><a href="#tkb">THỜI KHOÁ BIỂU</a></li>
                <li><a href="#nghenghiep">Nghề nghiệp</a></li>
                <li><a href="https://fond-dove-04065962.figma.site/" target="_blank">Nghề nghiệp 2.0</a></li>
            </ol>

            <h2>📄 TÀI LIỆU</h2>
            <ul>
                <li><a href="#">Chưa có tài liệu</a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <div class="content-area">
            <header class="header">
                <h1>🎓 CHƯƠNG TRÌNH TIN HỌC LỚP 12</h1>
            </header>

            <main class="content-display">
                <!-- Welcome Message (Default) -->
                <div id="welcome" class="welcome-message">
                    <h2>Chào mừng!</h2>
                    <p>Vui lòng chọn một mục từ menu bên trái để bắt đầu.</p>
                </div>

                <!-- Content Frames -->
                <iframe id="intro" class="content-frame" src="contents/gioithieu.html"></iframe>
                <iframe id="tinhoc" class="content-frame" src="contents/tinhoc12.html"></iframe>
                <iframe id="tkb" class="content-frame" src="contents/Tkb.html"></iframe>
                <iframe id="nghenghiep" class="content-frame" src="contents/nghenghiep.html"></iframe>
            </main>
        </div>
    </div>
</body>
</html>
