<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Trang chính</title>
  <link rel="stylesheet" href="../Style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: url("unnamed.jpg") center / cover no-repeat;
      padding: 15px;
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
    }
    .menu {
      background: #333;
      color: white;
    }
    .content {
      flex: 1;
      padding: 15px;
      background: #fff;
    }
    .footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      min-height: 500px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    TRANG HỌC TẬP / TIN HỌC LỚP 12
  </div>

  <div class="menu">
    <iframe src="List.html" frameborder="0" scrolling="no" id="menu-frame"></iframe>
  </div>

  <div class="content">
    <iframe style="height: 50px;" name="noidung" src="contents/gioithieu.html" frameborder="0"></iframe>
  </div>

  <div class="footer">
    © 2026 - Bài tập HTML/CSS cơ bản
  </div>
</div>

</body>
</html>
