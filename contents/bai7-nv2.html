<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng kí tham gia Hội thao</title>
</head>
<body>

    <form action="camon.html" method="get">
        
        <h2>Đăng kí tham gia Hội thao</h2>

        <label>Họ và tên: </label>
        <input type="text" name="txtHoTen">
        <br><br>

        <label>Địa chỉ email: </label>
        <input type="email" name="txtEmail">
        <br><br>

        <input type="radio" name="Lop" value="10"> Lớp 10
        <input type="radio" name="Lop" value="11"> Lớp 11
        <input type="radio" name="Lop" value="12"> Lớp 12
        <br><br>

        <p>Tham dự môn:</p>
        
        <input type="checkbox" name="chkMon" value="BongBan"> Bóng bàn <br>
        <input type="checkbox" name="chkMon" value="CauLong"> Cầu lông <br>
        <input type="checkbox" name="chkMon" value="CoVua"> Cờ vua <br>

        <br>
        <input type="submit" value="Đăng kí">
        <input type="reset" value="Huỷ bỏ">

    </form>

</body>
</html>
